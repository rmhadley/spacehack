[project]
name = "spacehack"
version = "0.0.1"
description = "A terminal-based roguelike built on python-tcod."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "spacehack" }]
dependencies = [
    "tcod>=16",
]

[project.scripts]
spacehack = "spacehack.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacehack = ["data/*.png", "data/*.ttf", "data/*.otf", "data/layouts/*.layout"]
