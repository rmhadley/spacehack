[project]
name = "spacehack"
version = "0.0.1"
description = "A traditional ASCII-art sci-fi roguelike built on Pygame."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rmhadley" }]
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
spacehack = "spacehack.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 license = "MIT" SPDX form
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacehack = ["data/*.png", "data/*.ttf", "data/layouts/*.layout", "data/landmarks/*.layout"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Kept intentionally narrow: pyflakes (undefined names, unused imports,
# shadowed definitions -- the class of bug that causes a crash the test
# suite can miss if the code path isn't exercised) plus real syntax errors.
# Not a style linter -- E/W/formatting rules are deliberately left off.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export names for their package's public API;
# those imports are "unused" by pyflakes' own reading but intentional.
"**/__init__.py" = ["F401"]
