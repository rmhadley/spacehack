[project]
name = "spacehack"
version = "0.0.1"
description = "A traditional ASCII-art sci-fi roguelike built on Pygame."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rmhadley" }]
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
spacehack = "spacehack.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 license = "MIT" SPDX form
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spacehack = ["data/*.png", "data/*.ttf", "data/layouts/*.layout", "data/landmarks/*.layout"]
